<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Stoic pillar/column design with calendar elements -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3174ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)"/>

  <!-- Calendar page outline -->
  <rect x="25" y="20" width="50" height="60" rx="4" fill="white"/>

  <!-- Calendar top bar -->
  <rect x="25" y="20" width="50" height="12" rx="4" fill="#2563a0"/>

  <!-- Calendar rings -->
  <circle cx="35" cy="26" r="2" fill="white"/>
  <circle cx="50" cy="26" r="2" fill="white"/>
  <circle cx="65" cy="26" r="2" fill="white"/>

  <!-- Greek column capital on calendar -->
  <path d="M 30 42 L 70 42 L 68 46 L 32 46 Z" fill="#3174ad"/>
  <rect x="32" y="46" width="36" height="20" fill="#3174ad" opacity="0.9"/>
  <path d="M 32 66 L 30 70 L 70 70 L 68 66 Z" fill="#3174ad"/>

  <!-- Stoic wisdom mark (phi symbol) -->
  <text x="50" y="60" font-family="serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Φ</text>
</svg>
